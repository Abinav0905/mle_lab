services:
  airflow-init:
    build: .
    image: cs611_assignment2_airflow:latest
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=cs611_assignment2
      - PROJECT_DIR=/app
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - .:/app
    entrypoint: >
      /bin/bash -c "airflow db migrate &&
      airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true"

  airflow-webserver:
    build: .
    image: cs611_assignment2_airflow:latest
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=cs611_assignment2
      - PROJECT_DIR=/app
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - .:/app
    ports:
      - "8080:8080"
    command: webserver

  airflow-scheduler:
    build: .
    image: cs611_assignment2_airflow:latest
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__FERNET_KEY=PAqBeGJLJTYFzVkOGHWIYXdLO7XdXz5yTdxAGJe9ezM=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__WEBSERVER__SECRET_KEY=cs611_assignment2
      - PROJECT_DIR=/app
    volumes:
      - airflow_data:/opt/airflow
      - ./dags:/opt/airflow/dags
      - .:/app
    command: scheduler

volumes:
  airflow_data:
